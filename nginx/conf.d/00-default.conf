# Default server — handles health checks and rejects unmatched requests
server {
    listen 80 default_server;
    server_name _;

    # Health check endpoint for Docker
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Let's Encrypt HTTP-01 for a name that has no vhost yet (`dockweb ssl issue-le <host>`): any host that reaches this default server
    # can be validated; names with their own vhost serve this path from their own port-80 block.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Reject all other requests to unknown hosts
    location / {
        return 444;
    }
}
